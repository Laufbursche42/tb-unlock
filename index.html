<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- frame-ancestors is ignored in a meta element by the browser; it only works as an HTTP header.
     GitHub Pages sends no custom headers, so it is left out here. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="pageTitle">Laufbursche Trittbrett Tool</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
<link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
<div class="wrap">

  <!-- header (canonical) -------------------------------------------------- -->
  <header>
    <h1>Laufbursche <span data-t="brandSub"></span></h1>
    <div class="head-right">
      <span class="status" id="status" data-state="disconnected">disconnected</span>
      <div class="head-tools">
        <button type="button" class="theme-btn" id="btn-theme">&#9728;</button>
        <div class="langs" id="langs" role="group">
          <button type="button" data-lang="de" aria-pressed="true">DE</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </div>
  </header>

  <div class="sunset-banner" role="alert" data-t="sunsetBannerHtml"></div>
  <p class="hint infobox" data-t="androidAppHtml"></p>

  <!-- shown only when the browser has no Web Bluetooth -->
  <p class="warn" id="platform-note" data-t="noWebBt" hidden></p>

  <!-- intro (always visible) ---------------------------------------------- -->
  <div class="card">
    <h2 data-t="introTitle"></h2>
    <p class="hint" data-t="introLive"></p>
    <p class="hint"><span data-t="introGuide"></span> <a href="#" id="intro-guide-link" data-doc="GUIDE" data-t="footGuide"></a></p>
    <p class="warn" data-t="expWarn"></p>
    <p class="hint" data-t="ownDevice"></p>
  </div>

  <!-- connection (always visible) ----------------------------------------- -->
  <div class="card">
    <h2 data-t="connTitle"></h2>
    <div class="remembered" id="remembered-wrap">
      <label data-t="rememberedTitle"></label>
      <div id="remembered-list"></div>
      <p class="hint" id="remembered-empty" data-t="rememberedEmpty"></p>
    </div>
    <p class="hint" data-t="reconnectHint"></p>
    <hr class="sep">
    <div class="set-row">
      <label data-t="filterLabel"></label>
      <select id="model-filter">
        <option value="all" data-t="filterAll"></option>
        <option value="tested" data-t="filterTested"></option>
        <option value="untested" data-t="filterUntested"></option>
      </select>
    </div>
    <div class="set-row">
      <label data-t="modelLabel"></label>
      <select id="model-in"></select>
    </div>
    <p class="hint" data-t="modelHint"></p>
    <div class="set-row">
      <label data-t="pinLabel"></label>
      <input id="pin-in" type="text" maxlength="8" inputmode="numeric" autocomplete="off" placeholder="888888">
    </div>
    <p class="hint" data-t="pinHint"></p>
    <div class="btns">
      <button class="primary span2" id="btn-conn" data-t="connectBtn"></button>
    </div>
    <p class="hint" id="devinfo"></p>
  </div>

  <!-- live telemetry (hidden until connected) ----------------------------- -->
  <div class="card" id="live-card" hidden>
    <h2 data-t="liveTitle"></h2>
    <div class="grid" id="tiles-grid"></div>
    <p class="hint" id="live-hint" data-t="liveHint"></p>
    <p class="hint" id="tiles-empty" data-t="liveEmpty"></p>
    <div class="tile-manager" id="tile-manager"></div>
  </div>

  <!-- battery telemetry (hidden until connected) -------------------------- -->
  <div class="card" id="batt-card" hidden>
    <h2 data-t="battTitle"></h2>
    <p class="hint" data-t="battHint"></p>
  </div>

  <!-- settings (hidden until connected) ----------------------------------- -->
  <div class="card" id="more-card" hidden>
    <h2 data-t="setTitle"></h2>

    <h3 class="set-group" data-t="setgrpSpeed"></h3>
    <div id="sect-lock">
      <div class="sect-body">
        <p class="danger" id="untested-warn" hidden></p>
        <div class="btns">
          <button class="primary" id="btn-drossel-out" data-t="drosselOut" disabled></button>
          <button class="primary" id="btn-drossel-in" data-t="drosselIn" disabled></button>
        </div>
        <div class="speed-cols">
          <div class="set-row">
            <label data-t="lblOpen"></label>
            <input id="speed-open" type="number" step="0.1" min="1" max="60" value="30" disabled>
          </div>
          <div class="set-row">
            <label data-t="lblLegal"></label>
            <input id="speed-legal" type="number" step="0.1" min="1" max="60" value="22" disabled>
          </div>
        </div>
        <p class="hint" data-t="speedValuesHint"></p>
      </div>
    </div>

    <h3 class="set-group" data-t="setgrpGeneral"></h3>
    <div id="settings-body"></div>
    <p class="hint" id="settings-empty" data-t="setEmpty"></p>
  </div>

  <!-- advanced settings (hidden until connected) -------------------------- -->
  <div class="card" id="raw-card" hidden>
    <h2 data-t="advTitle"></h2>
    <div id="advanced-body"></div>
    <p class="hint" id="advanced-empty" data-t="advEmpty"></p>
  </div>

  <!-- log ----------------------------------------------------------------- -->
  <div class="card">
    <h2 data-t="logTitle"></h2>
    <div class="log-opts">
      <div class="log-opt">
        <span data-t="publicLogLabel"></span>
        <input type="checkbox" id="public-log" checked>
        <button type="button" class="help-btn" data-help="publiclog" aria-label="?">?</button>
      </div>
      <div class="log-opt">
        <span data-t="diagLogLabel"></span>
        <input type="checkbox" id="diag-log">
        <button type="button" class="help-btn" data-help="diaglog" aria-label="?">?</button>
      </div>
    </div>
    <div class="btns">
      <button type="button" id="btn-copy-log" data-t="btnCopyLog"></button>
      <button type="button" id="btn-clear-log" data-t="btnClearLog"></button>
      <button type="button" id="btn-save-log" class="span2" data-t="btnSaveLog"></button>
    </div>
    <pre id="log"></pre>
    <p class="hint"><span class="log-tx" data-t="logTxLegend"></span>, <span class="log-rx" data-t="logRxLegend"></span></p>
  </div>

  <!-- footer (canonical) -------------------------------------------------- -->
  <footer class="foot">
    <span class="foot-links">
      <a id="link-guide" href="GUIDE.de.md" data-doc="GUIDE" data-t="footGuide"></a>
      <a href="https://github.com/Laufbursche42/tb-unlock" target="_blank" rel="noopener" data-t="footSource"></a>
      <a id="link-readme" href="README.md" data-doc="README" data-t="footReadme"></a>
      <a id="link-disclaimer" href="#" data-t="footDisclaimer"></a>
      <a id="link-license" href="LICENSE.de.md" data-doc="LICENSE" data-t="footLicense"></a>
      <a id="link-privacy" href="PRIVACY.de.md" data-doc="PRIVACY" data-t="footPrivacy"></a>
      <a id="link-trademarks" href="TRADEMARKS.de.md" data-doc="TRADEMARKS" data-t="footTrademarks"></a>
    </span>
    <span class="foot-links"><span class="ver" id="build-ver"></span><a href="https://github.com/Laufbursche42/Laufbursche42/issues" target="_blank" rel="noopener" data-t="footIssue"></a></span>
    <a class="foot-copy" href="https://laufbursche42.github.io/Laufbursche42/" target="_blank" rel="noopener">Copyright (c) 2026 Laufbursche</a>
  </footer>
</div>

<!-- doc modal (guide / readme / changelog / license / privacy / trademarks / disclaimer) -->
<dialog id="doc" aria-labelledby="doc-title">
  <div class="doc-head">
    <h3 id="doc-title"></h3>
    <button type="button" class="doc-x" id="doc-x">&times;</button>
  </div>
  <div class="doc-body" id="doc-body"></div>
  <div class="doc-foot">
    <button type="button" id="doc-close" data-t="docClose"></button>
  </div>
</dialog>

<!-- confirm modal for risky writes -->
<dialog id="confirm" aria-labelledby="confirm-title">
  <div class="doc-head">
    <h3 id="confirm-title" data-t="confirmTitle"></h3>
    <button type="button" class="doc-x" id="confirm-x">&times;</button>
  </div>
  <div class="doc-body"><p id="confirm-body"></p></div>
  <div class="doc-foot">
    <button type="button" id="confirm-cancel" data-t="confirmCancel"></button>
    <button type="button" id="confirm-ok" class="danger" data-t="confirmYes"></button>
  </div>
</dialog>

<!-- help modal (log options) -->
<dialog id="help" aria-labelledby="help-title">
  <div class="doc-head">
    <h3 id="help-title"></h3>
    <button type="button" class="doc-x" id="help-x">&times;</button>
  </div>
  <div class="doc-body" id="help-body"></div>
  <div class="doc-foot">
    <button type="button" id="help-close" data-t="docClose"></button>
  </div>
</dialog>

<script defer src="drivers/base.js?v=26"></script>
<script defer src="drivers/zyd.js?v=26"></script>
<script defer src="i18n.js?v=26"></script>
<script defer src="app.js?v=27"></script>
</body>
</html>
